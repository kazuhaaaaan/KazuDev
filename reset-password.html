<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Reset Password - CertiFolio</title>
    <link rel="icon" type="image/x-icon" href="./dist/img/logo2.webp">
    
    <script>
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark')
        } else {
            document.documentElement.classList.remove('dark')
        }
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: { dark: { bg: '#020617', card: '#0f172a', border: '#1e293b' } }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 dark:bg-dark-bg text-slate-900 dark:text-slate-100 min-h-screen flex items-center justify-center p-4 transition-all duration-300">

    <div class="w-full max-w-md">
        <div class="bg-white dark:bg-dark-card p-8 rounded-[2.5rem] shadow-2xl border border-slate-200 dark:border-dark-border relative overflow-hidden">
            
            <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-600/10 rounded-full blur-3xl"></div>
            <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-purple-600/10 rounded-full blur-3xl"></div>

            <div class="text-center mb-10 relative">
                <div class="inline-flex p-4 bg-indigo-600 rounded-3xl text-white shadow-lg shadow-indigo-200 dark:shadow-none mb-4">
                    <i data-lucide="lock-keyhole" class="w-8 h-8"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight">Reset Password</h1>
                <p class="text-slate-500 dark:text-slate-400 text-sm mt-2">Buat password baru untuk akun admin</p>
            </div>

            <div id="invalid-state" class="hidden text-center relative">
                <div class="p-4 bg-red-50 dark:bg-red-900/10 text-red-600 dark:text-red-400 rounded-2xl text-sm font-medium mb-6">
                    Link reset tidak valid atau sudah kedaluwarsa. Silakan minta link baru.
                </div>
                <a href="login.html" class="inline-flex items-center justify-center gap-2 w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-xl shadow-indigo-200 dark:shadow-none">
                    <i data-lucide="arrow-left" class="w-5 h-5"></i> Kembali ke Login
                </a>
            </div>

            <form id="reset-form" class="space-y-6 relative hidden">
                <div>
                    <label class="block text-sm font-bold mb-2 ml-1 opacity-80">Password Baru</label>
                    <div class="relative">
                        <i data-lucide="key-round" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="password" id="new-password" placeholder="••••••••" minlength="6" required 
                            class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold mb-2 ml-1 opacity-80">Konfirmasi Password</label>
                    <div class="relative">
                        <i data-lucide="shield-check" class="absolute left-4 top-1/2 -translate-y-1/2 w-5 h-5 text-slate-400"></i>
                        <input type="password" id="confirm-password" placeholder="••••••••" minlength="6" required 
                            class="w-full pl-12 pr-4 py-4 rounded-2xl border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-800 focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                    </div>
                </div>

                <button type="submit" id="reset-btn" 
                    class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold hover:bg-indigo-700 active:scale-[0.98] transition-all shadow-xl shadow-indigo-200 dark:shadow-none flex items-center justify-center gap-3 text-lg">
                    <i data-lucide="key-round" class="w-5 h-5"></i> Simpan Password
                </button>
            </form>

            <div class="mt-8 pt-6 border-t border-slate-100 dark:border-slate-800 text-center">
                <a href="index.html" class="text-sm font-medium text-slate-500 hover:text-indigo-600 transition-colors inline-flex items-center gap-2">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Kembali ke Beranda
                </a>
            </div>
        </div>

        <p class="text-center mt-8 text-xs text-slate-400 font-medium tracking-widest uppercase">
            &copy; 2026 Nouva Prasetya Ardhana
        </p>
    </div>

    <script>
        // --- 1. Konfigurasi Supabase ---
        const SUPABASE_URL = 'https://gnvyjnycgtmbktbcugda.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdudnlqbnljZ3RtYmt0YmN1Z2RhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY4NTY2MjcsImV4cCI6MjA5MjQzMjYyN30.tHLospYWjAOIcYwBJBrSqh5GnW1Bt23ecJqrBSlehu8';
        const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        const resetForm = document.getElementById('reset-form');
        const resetBtn = document.getElementById('reset-btn');
        const invalidState = document.getElementById('invalid-state');

        function showForm() {
            resetForm.classList.remove('hidden');
            invalidState.classList.add('hidden');
        }

        function showInvalid() {
            resetForm.classList.add('hidden');
            invalidState.classList.remove('hidden');
        }

        // --- 2. Pastikan Ada Sesi Recovery yang Valid ---
        sbClient.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY' || session) showForm();
        });

        async function checkRecoverySession() {
            const { data } = await sbClient.auth.getSession();
            if (data.session) {
                showForm();
            } else {
                showInvalid();
            }
        }
        checkRecoverySession();

        // --- 3. Simpan Password Baru ---
        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const password = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                alert('Konfirmasi password tidak cocok.');
                return;
            }

            resetBtn.disabled = true;
            resetBtn.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Menyimpan...`;

            try {
                const { error } = await sbClient.auth.updateUser({ password });
                if (error) throw error;

                alert('Password berhasil diperbarui. Silakan login dengan password baru.');
                await sbClient.auth.signOut();
                window.location.href = 'login.html';

            } catch (err) {
                alert('Gagal memperbarui password: ' + err.message);
                resetBtn.disabled = false;
                resetBtn.innerHTML = `<i data-lucide="key-round" class="w-5 h-5"></i> Simpan Password`;
                lucide.createIcons();
            }
        });

        // Initialize Icons
        lucide.createIcons();
    </script>
</body>
</html>
